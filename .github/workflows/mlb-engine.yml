name: MLB Engine

on:
  workflow_dispatch:
  schedule:
    # One final-week refresh at 5 PM EDT. Low-quota mode keeps the core MLB
    # dashboard alive without consuming the budget reserved for Sunday NFL.
    - cron: "0 21 * * *"

jobs:
  run-mlb-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      ENABLE_FANDUEL_FALLBACK: "true"
      MLB_LOW_QUOTA_MODE: "true"
      MLB_ODDS_CREDIT_FLOOR: "100"
    steps:
      - name: Check final-week window
        id: window
        shell: bash
        run: |
          today="$(date -u +%F)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$today" < "2026-09-30" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Automatic final-week MLB refresh window is closed."
          fi

      - name: Check out repo
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pytz gspread google-auth google-genai gspread-dataframe pybaseball

      - name: Run MLB engine
        if: steps.window.outputs.run == 'true'
        run: python MLBEnginev5-4.py
